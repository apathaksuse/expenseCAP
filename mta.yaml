_schema-version: 3.3.0
ID: expense2
description: A simple CAP project.
version: 1.0.0
modules:
- name: expense2-srv
  type: nodejs
  path: gen/srv
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: expense2-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: expense2-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - comdemoexpensereportemployeeexpense.zip
      name: comdemoexpensereportemployeeexpense
      target-path: resources/
    - artifacts:
      - comdemoadminreportadminreport.zip
      name: comdemoadminreportadminreport
      target-path: resources/
- name: comdemoexpensereportemployeeexpense
  type: html5
  path: app/employeeexpense
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: comdemoadminreportadminreport
  type: html5
  path: app/adminreport
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: expense2-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: expense2-html5-service
    service-plan: app-host
- name: expense2-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: expense2-destination-service
    service-plan: lite
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
